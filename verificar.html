<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar certificado · ICADEM</title>
<meta name="description" content="Valida la autenticidad de un certificado ICADEM con su folio único o escaneando su código QR.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02050f; --surface:rgba(11,22,44,.66); --border:rgba(147,197,253,.14);
  --text:#f0f4fa; --text-2:#b6c2d8; --text-3:#8997b0;
  --primary:#0b2f68; --primary-soft:#93c5fd; --gold:#f5d77a;
  --ok:#34d399; --err:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px;position:relative;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(600px 360px at 80% 0%, rgba(11,47,104,.55), transparent 65%),
    radial-gradient(520px 320px at 8% 100%, rgba(245,215,122,.10), transparent 60%);
}
.wrap{width:100%;max-width:560px;position:relative;z-index:1}
.brand{text-align:center;margin-bottom:22px}
.brand .logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
.brand .logo b{color:var(--gold)}
.brand p{color:var(--text-3);font-size:12.5px;margin-top:4px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.45);
}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--text-2);font-size:13px;line-height:1.6;margin:6px 0 18px}
.row{display:flex;gap:10px}
input{
  flex:1;background:rgba(2,5,15,.6);border:1px solid var(--border);border-radius:13px;
  padding:13px 16px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13.5px;
  letter-spacing:.06em;outline:none;transition:border-color .18s, box-shadow .18s;min-width:0;
}
input::placeholder{color:var(--text-3);letter-spacing:.04em}
input:focus{border-color:var(--primary-soft);box-shadow:0 0 0 3px rgba(147,197,253,.14)}
button{
  border:none;border-radius:13px;padding:13px 22px;font-family:'Inter',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;color:#0a1020;
  background:linear-gradient(135deg,var(--gold),#e9c45a);
  box-shadow:0 10px 26px rgba(245,215,122,.22);transition:transform .15s, box-shadow .15s;
  flex-shrink:0;
}
button:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(245,215,122,.3)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
#result{margin-top:20px;display:none}
.res{
  border-radius:18px;padding:22px;border:1px solid;
  animation:fadeUp .35s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.res--ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.3)}
.res--err{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.3)}
.res__head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.res__badge{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.res--ok .res__badge{background:rgba(52,211,153,.16);color:var(--ok)}
.res--err .res__badge{background:rgba(248,113,113,.16);color:var(--err)}
.res__badge svg{width:22px;height:22px}
.res__title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:16px}
.res--ok .res__title{color:var(--ok)} .res--err .res__title{color:var(--err)}
.res__sub{font-size:12px;color:var(--text-3);margin-top:2px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.dl .it{min-width:0}
.dl .k{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);font-family:'JetBrains Mono',monospace}
.dl .v{font-size:14px;font-weight:600;margin-top:3px;word-break:break-word}
.dl .it--full{grid-column:1/-1}
.dl .v--name{font-size:17px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif}
.folio-pill{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  background:rgba(2,5,15,.5);border:1px solid var(--border);border-radius:99px;
  padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:.05em;
}
.spinner{width:18px;height:18px;border:2.5px solid rgba(10,16,32,.3);border-top-color:#0a1020;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:20px;text-align:center;color:var(--text-3);font-size:11.5px;line-height:1.7}
.foot a{color:var(--primary-soft);text-decoration:none}
@media (max-width:480px){ .row{flex-direction:column} .dl{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">ICADE<b>M</b></div>
    <p>Capacitación empresarial, fiscal y legal</p>
  </div>
  <div class="card">
    <h1>Verificación de certificados</h1>
    <p class="sub">Ingresa el folio del certificado o escanea su código QR para validar su autenticidad en nuestro registro oficial.</p>
    <div class="row">
      <input id="folio-input" placeholder="ICADEM-2026-XXXXXX" autocomplete="off" spellcheck="false" autocapitalize="characters">
      <button id="btn-verify">Verificar</button>
    </div>
    <div id="result"></div>
  </div>
  <p class="foot">Registro oficial de certificados de ICADEM · <a href="https://www.icademx.com">icademx.com</a></p>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBzPC1wxbzOYutcECtwYBWTTbo76cqrmdA',
  authDomain: 'icadem-vip.firebaseapp.com',
  projectId: 'icadem-vip',
  storageBucket: 'icadem-vip.firebasestorage.app',
  messagingSenderId: '12508983783',
  appId: '1:12508983783:web:b12be6f1fab9bb91fb8d42'
});
const db = getFirestore(app);

const $in = document.getElementById('folio-input');
const $btn = document.getElementById('btn-verify');
const $res = document.getElementById('result');

const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
const ICON_ERR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtFecha(v){
  try {
    const d = v?.toDate ? v.toDate() : new Date(v);
    if (isNaN(d)) return String(v || '—');
    return d.toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' });
  } catch(e){ return String(v || '—'); }
}

async function verificar(folio){
  folio = (folio || '').trim().toUpperCase();
  if (!folio) { $in.focus(); return; }
  $btn.disabled = true; const orig = $btn.innerHTML; $btn.innerHTML = '<span class="spinner"></span>';
  $res.style.display = 'none';
  try {
    const snap = await getDoc(doc(db, 'certificados', folio));
    if (!snap.exists()) {
      $res.innerHTML = `
        <div class="res res--err">
          <div class="res__head">
            <div class="res__badge">${ICON_ERR}</div>
            <div><div class="res__title">Certificado no encontrado</div>
            <div class="res__sub">El folio no existe en el registro oficial de ICADEM</div></div>
          </div>
          <p style="font-size:13px;color:var(--text-2);line-height:1.6;">Revisa que el folio esté escrito exactamente como aparece en el certificado (por ejemplo <span style="font-family:'JetBrains Mono',monospace;color:var(--gold);">ICADEM-2026-A1B2C3</span>). Si crees que es un error, escríbenos desde <a href="https://www.icademx.com" style="color:var(--primary-soft);">icademx.com</a>.</p>
        </div>`;
    } else {
      const c = snap.data();
      // Esquema nuevo con fallback al viejo (nombreAlumno / fecha)
      const nombre = c.nombre || c.nombreAlumno || '—';
      const emitido = c.emitido || c.fecha || c.createdAt || null;
      const carga = [c.sesiones ? `${c.sesiones} sesiones` : null, c.horas ? `${c.horas} horas` : null].filter(Boolean).join(' · ') || '—';
      $res.innerHTML = `
        <div class="res res--ok">
          <div class="res__head">
            <div class="res__badge">${ICON_OK}</div>
            <div><div class="res__title">Certificado auténtico</div>
            <div class="res__sub">Emitido y registrado oficialmente por ICADEM</div></div>
          </div>
          <div class="dl">
            <div class="it it--full"><div class="k">Otorgado a</div><div class="v v--name">${esc(nombre)}</div></div>
            <div class="it it--full"><div class="k">Curso</div><div class="v">${esc(c.curso || '—')}</div></div>
            <div class="it"><div class="k">Área</div><div class="v">${esc(c.area || '—')}</div></div>
            <div class="it"><div class="k">Carga académica</div><div class="v">${esc(carga)}</div></div>
            <div class="it"><div class="k">Instructor</div><div class="v">${esc(c.instructor || 'Equipo ICADEM')}</div></div>
            <div class="it"><div class="k">Fecha de emisión</div><div class="v">${fmtFecha(emitido)}</div></div>
          </div>
          <span class="folio-pill">Folio · ${esc(snap.id)}</span>
        </div>`;
    }
  } catch (e) {
    $res.innerHTML = `
      <div class="res res--err">
        <div class="res__head">
          <div class="res__badge">${ICON_ERR}</div>
          <div><div class="res__title">No se pudo verificar</div>
          <div class="res__sub">${esc(e.message || 'Error de conexión')}</div></div>
        </div>
        <p style="font-size:13px;color:var(--text-2);">Revisa tu conexión e intenta de nuevo.</p>
      </div>`;
  }
  $res.style.display = 'block';
  $btn.disabled = false; $btn.innerHTML = orig;
}

$btn.addEventListener('click', () => verificar($in.value));
$in.addEventListener('keydown', e => { if (e.key === 'Enter') verificar($in.value); });

// Folio por URL (?folio=) → verificación automática (QR)
const f = new URLSearchParams(location.search).get('folio');
if (f) { $in.value = f.toUpperCase(); verificar(f); }
</script>
</body>
</html>
